{% load i18n %}
<div class="btn-group btn-group-sm mt-1" role="group">
    <button type="button" class="btn btn-outline-secondary" data-start-preset="today">
        {% translate "Today" %}
    </button>
    <button type="button" class="btn btn-outline-secondary" data-start-preset="monday">
        {% translate "Next Monday" %}
    </button>
</div>
<script>
    (function () {
        document.querySelectorAll('[data-start-preset]').forEach(function (button) {
            button.addEventListener('click', function () {
                const input = document.getElementById('id_start');
                if (!input) return;
                const now = new Date();
                if (button.dataset.startPreset === 'monday') {
                    now.setDate(now.getDate() + ((8 - now.getDay()) % 7 || 7));
                }
                input.value = now.toISOString().slice(0, 10);
            });
        });
    })();
</script>
